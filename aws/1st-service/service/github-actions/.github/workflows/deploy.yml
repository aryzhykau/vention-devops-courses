name: CI/CD Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: aws-1st-service
  ECS_SERVICE: aws-1st-service-service
  ECS_CLUSTER: aws-1st-service-cluster
  ECS_TASK_DEFINITION: aws-1st-service-task
  APP_URL: https://your-expected-app-url.com

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci
        working-directory: aws/1st-service/service/app

      - name: Run tests
        run: npm run test
        working-directory: aws/1st-service/service/app

      - name: Run lint
        run: npm run lint
        working-directory: aws/1st-service/service/app

  deploy:
    needs: test
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin 601457281385.dkr.ecr.$AWS_REGION.amazonaws.com

      - name: Build Docker image
        run: |
          docker build -t $ECR_REPOSITORY aws/1st-service/service/app
          docker tag $ECR_REPOSITORY:latest 601457281385.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY

      - name: Push Docker image to ECR
        run: |
          docker push 601457281385.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY

      - name: Deploy Infrastructure with Terraform
        working-directory: aws/1st-service/terraform
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Run Health Check
        run: |
          curl -f $APP_URL/health || exit 1
